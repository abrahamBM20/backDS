version: '3.9'

services:
  mysql-backend:
    image: mysql:8.0
    container_name: mysql-backend
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-proyecto_db}
      MYSQL_USER: ${MYSQL_USER:-usuario}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  backend-ventas:
    build:
      context: ./api-ventas
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
    container_name: backend-ventas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: ${DB_ENDPOINT:-mysql-backend}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-proyecto_db}
      DB_USERNAME: ${DB_USERNAME:-usuario}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      mysql-backend:
        condition: service_healthy
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend-despachos:
    build:
      context: ./api-despachos
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
    container_name: backend-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: ${DB_ENDPOINT:-mysql-backend}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-proyecto_db}
      DB_USERNAME: ${DB_USERNAME:-usuario}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      mysql-backend:
        condition: service_healthy
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local