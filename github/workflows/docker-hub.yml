name: Interactuar con Docker Hub

on:
  push:
    branches:
      - deploy # O la rama que estés usando para tus pruebas

jobs:
  docker-job:
    runs-on: ubuntu-latest # Esta máquina ya viene con Docker instalado

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout de código
        uses: actions/checkout@v3

      # 2. Autenticarse en Docker Hub usando los Secrets
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Hacer el PULL de la imagen
      - name: Descargar imagen desde Docker Hub
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tu-imagen-proyecto:latest
          
      # 4. (Opcional) Verificar que la imagen se descargó en GitHub
      - name: Listar imágenes locales en el runner
        run: docker images