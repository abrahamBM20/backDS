name: Deploy Capa Backend a AWS ECR y EC2

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generar versión de imagen
        id: image-tag
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}
          TIMESTAMP=$(date +%s)
          echo "TAG=${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT

      - name: Build y push - backend-ventas
        uses: docker/build-push-action@v4
        with:
          context: ./api-ventas
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/backend-ventas:latest
            ${{ env.ECR_REGISTRY }}/backend-ventas:${{ steps.image-tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push - backend-despachos
        uses: docker/build-push-action@v4
        with:
          context: ./api-despachos
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/backend-despachos:latest
            ${{ env.ECR_REGISTRY }}/backend-despachos:${{ steps.image-tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar imágenes ECR
        run: |
          aws ecr describe-images --repository-name backend-ventas --image-ids imageTag=latest --region ${{ env.AWS_REGION }}
          aws ecr describe-images --repository-name backend-despachos --image-ids imageTag=latest --region ${{ env.AWS_REGION }}

      - name: Desplegar en EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --region ${{ env.AWS_REGION }} \
            --comment "Deploy: ${{ steps.image-tag.outputs.COMMIT_MESSAGE }}" \
            --parameters 'commands=[
              "#!/bin/bash",
              "set -e",
              "echo \"Iniciando despliegue...\"",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
              "docker pull ${{ env.ECR_REGISTRY }}/backend-ventas:latest",
              "docker pull ${{ env.ECR_REGISTRY }}/backend-despachos:latest",
              "docker-compose -f /app/docker-compose.yml down || true",
              "cd /app && docker-compose up -d",
              "docker ps",
              "sleep 10",
              "curl -f http://localhost:8080/actuator/health || exit 1",
              "curl -f http://localhost:8081/actuator/health || exit 1",
              "echo \"Despliegue completado exitosamente\""
            ]'

      - name: Notificar estado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deploy exitoso: ${{ steps.image-tag.outputs.TAG }}"
          else
            echo "❌ Deploy falló"
            exit 1
          fi